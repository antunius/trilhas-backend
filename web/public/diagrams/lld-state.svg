<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" style="background:transparent">
  <style>
    .ctx { fill: #2a2114; stroke: #fbbf24; stroke-width: 1.8; rx: 6; }
    .iface { fill: #1e2438; stroke: #818cf8; stroke-width: 1.8; rx: 6; }
    .impl { fill: #14241f; stroke: #34d399; stroke-width: 1.5; rx: 6; }
    .title { font-size: 13px; fill: #e8eaed; font-weight: 700; }
    .member { font-size: 11px; fill: #9aa3b2; font-family: monospace; }
    .caption { font-size: 15px; font-weight: 600; fill: #e8eaed; }
    .small { font-size: 11px; fill: #9aa3b2; }
    .arrow { stroke: #34d399; stroke-width: 1.6; fill: none; marker-end: url(#ah-sta);}
    .dashed { stroke: #8b95a5; stroke-width: 1.3; fill: none; stroke-dasharray: 4 3; marker-end: url(#ah-sta); }
  </style>
  <defs>
    <marker id="ah-sta" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8b95a5"/></marker>
  </defs>

  <text x="390" y="22" text-anchor="middle" class="caption">State — o objeto muda de comportamento trocando de estado interno</text>

  <rect x="280" y="42" width="220" height="60" class="ctx"/>
  <text x="390" y="64" text-anchor="middle" class="title">Pedido (contexto)</text>
  <text x="295" y="84" class="member">- estado: EstadoPedido</text>

  <path d="M390,102 L390,130" class="dashed"/>

  <rect x="280" y="135" width="220" height="40" class="iface"/>
  <text x="390" y="160" text-anchor="middle" class="small" font-weight="600">« interface » EstadoPedido</text>

  <rect x="40" y="200" width="180" height="55" class="impl"/>
  <text x="130" y="222" text-anchor="middle" class="small" font-weight="600">Criado</text>
  <text x="130" y="240" text-anchor="middle" class="small">pagar() → Pago</text>

  <rect x="300" y="200" width="180" height="55" class="impl"/>
  <text x="390" y="222" text-anchor="middle" class="small" font-weight="600">Pago</text>
  <text x="390" y="240" text-anchor="middle" class="small">enviar() → Enviado</text>

  <rect x="560" y="200" width="180" height="55" class="impl"/>
  <text x="650" y="222" text-anchor="middle" class="small" font-weight="600">Enviado</text>
  <text x="650" y="240" text-anchor="middle" class="small">cancelar() → erro</text>

  <path d="M300,175 L130,200" class="dashed"/>
  <path d="M390,175 L390,200" class="dashed"/>
  <path d="M480,175 L650,200" class="dashed"/>

  <path d="M220,227 L300,227" class="arrow"/>
  <path d="M480,227 L560,227" class="arrow"/>

  <text x="390" y="285" text-anchor="middle" class="small">pedido.pagar() delega para o objeto de estado atual — sem switch(estadoAtual) espalhado</text>
</svg>
