<svg viewBox="0 0 780 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" style="background:transparent">
  <style>
    .box { fill: #141a22; stroke: #3d4a5c; stroke-width: 2; rx: 6; }
    .shard { fill: #1e2438; stroke: #818cf8; stroke-width: 1.5; rx: 4; }
    .coord { fill: #2a2114; stroke: #fbbf24; stroke-width: 2; rx: 6; }
    .label { font-size: 13px; fill: #e8eaed; }
    .small { font-size: 11px; fill: #9aa3b2; }
    .title { font-size: 15px; font-weight: 600; fill: #e8eaed; }
    .arrow { stroke: #8b95a5; stroke-width: 1.6; fill: none; marker-end: url(#ah4); }
    .arrowback { stroke: #34d399; stroke-width: 1.6; fill: none; marker-end: url(#ah5); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="ah4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8b95a5"/>
    </marker>
    <marker id="ah5" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#34d399"/>
    </marker>
  </defs>

  <text x="390" y="25" text-anchor="middle" class="title">Busca distribuída: scatter para os shards, gather no coordenador</text>

  <!-- Client -->
  <rect x="20" y="140" width="110" height="60" class="box"/>
  <text x="75" y="165" text-anchor="middle" class="label">Cliente</text>
  <text x="75" y="182" text-anchor="middle" class="small">"engenheiro dados"</text>

  <!-- Coordinator -->
  <rect x="180" y="130" width="150" height="80" class="coord"/>
  <text x="255" y="160" text-anchor="middle" class="label" font-weight="600">Coordinating</text>
  <text x="255" y="176" text-anchor="middle" class="label" font-weight="600">Node</text>
  <text x="255" y="196" text-anchor="middle" class="small">planeja + combina</text>

  <path d="M130,170 L 180,170" class="arrow"/>

  <!-- Shards -->
  <rect x="400" y="50" width="160" height="55" class="shard"/>
  <text x="480" y="72" text-anchor="middle" class="label">Shard 0</text>
  <text x="480" y="90" text-anchor="middle" class="small">top 20 locais</text>

  <rect x="400" y="130" width="160" height="55" class="shard"/>
  <text x="480" y="152" text-anchor="middle" class="label">Shard 1</text>
  <text x="480" y="170" text-anchor="middle" class="small">top 20 locais</text>

  <rect x="400" y="210" width="160" height="55" class="shard"/>
  <text x="480" y="232" text-anchor="middle" class="label">Shard 2</text>
  <text x="480" y="250" text-anchor="middle" class="small">top 20 locais</text>

  <!-- scatter arrows -->
  <path d="M330,150 L 400,78" class="arrow"/>
  <path d="M330,160 L 400,157" class="arrow"/>
  <path d="M330,170 L 400,236" class="arrow"/>
  <text x="365" y="115" text-anchor="middle" class="small">scatter</text>

  <!-- gather arrows -->
  <path d="M400,95 L 330,185" class="arrowback"/>
  <path d="M400,165 L 330,195" class="arrowback"/>
  <path d="M400,245 L 330,205" class="arrowback"/>
  <text x="365" y="285" text-anchor="middle" class="small" fill="#34d399">gather (resultados + scores)</text>

  <path d="M180,190 L 130,190" class="arrow"/>
  <text x="255" y="315" text-anchor="middle" class="small">Coordenador combina, reordena globalmente, devolve o top N ao cliente</text>
</svg>
