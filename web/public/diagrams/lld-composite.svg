<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" style="background:transparent">
  <style>
    .iface { fill: #1e2438; stroke: #818cf8; stroke-width: 1.8; rx: 6; }
    .comp { fill: #2a2114; stroke: #fbbf24; stroke-width: 1.6; rx: 6; }
    .leaf { fill: #14241f; stroke: #34d399; stroke-width: 1.4; rx: 6; }
    .title { font-size: 12.5px; fill: #e8eaed; font-weight: 700; }
    .member { font-size: 10.5px; fill: #9aa3b2; font-family: monospace; }
    .caption { font-size: 15px; font-weight: 600; fill: #e8eaed; }
    .small { font-size: 11px; fill: #9aa3b2; }
    .arrow { stroke: #8b95a5; stroke-width: 1.4; fill: none; marker-end: url(#ah-c); }
    .dashed { stroke: #8b95a5; stroke-width: 1.3; fill: none; stroke-dasharray: 4 3; marker-end: url(#ah-c); }
  </style>
  <defs>
    <marker id="ah-c" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8b95a5"/></marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="caption">Composite — árvore de partes e todo, mesmo contrato</text>

  <rect x="270" y="40" width="180" height="45" class="iface"/>
  <text x="360" y="60" text-anchor="middle" class="small" font-weight="600">« interface » ItemDoSistemaDeArquivos</text>
  <text x="360" y="76" text-anchor="middle" class="small">calcularTamanho(): long</text>

  <rect x="60" y="120" width="180" height="60" class="comp"/>
  <text x="150" y="142" text-anchor="middle" class="small" font-weight="600" fill="#fbbf24">Pasta ("Documentos")</text>
  <text x="75" y="160" class="member">- filhos: List&lt;Item&gt;</text>
  <text x="75" y="174" class="member">calcularTamanho() → soma filhos</text>

  <path d="M270,80 L200,120" class="dashed"/>

  <rect x="480" y="120" width="180" height="55" class="leaf"/>
  <text x="570" y="142" text-anchor="middle" class="small" font-weight="600">Arquivo ("foto.png")</text>
  <text x="570" y="160" text-anchor="middle" class="member">calcularTamanho() → 2 MB</text>

  <path d="M450,80 L560,120" class="dashed"/>

  <rect x="20" y="220" width="150" height="55" class="leaf"/>
  <text x="95" y="242" text-anchor="middle" class="small" font-weight="600">Arquivo ("a.txt")</text>
  <text x="95" y="260" text-anchor="middle" class="member">→ 1 KB</text>

  <rect x="190" y="220" width="150" height="55" class="comp"/>
  <text x="265" y="242" text-anchor="middle" class="small" font-weight="600" fill="#fbbf24">Pasta ("Fotos")</text>
  <text x="265" y="260" text-anchor="middle" class="member">→ soma dos filhos</text>

  <path d="M150,180 L95,220" class="arrow"/>
  <path d="M150,180 L265,220" class="arrow"/>

  <text x="360" y="292" text-anchor="middle" class="small">Chamar calcularTamanho() na raiz soma recursivamente pastas e arquivos, sem distinguir os dois</text>
</svg>
