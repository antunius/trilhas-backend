<svg viewBox="0 0 820 250" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" style="background:transparent">
  <style>
    .box { fill: #141a22; stroke: #3d4a5c; stroke-width: 2; rx: 6; }
    .accent { fill: #1e2438; stroke: #818cf8; stroke-width: 1.6; rx: 6; }
    .ok { fill: #14241f; stroke: #34d399; stroke-width: 1.6; rx: 6; }
    .warn { fill: #2a2114; stroke: #fbbf24; stroke-width: 1.6; rx: 6; }
    .label { font-size: 12.5px; fill: #e8eaed; }
    .small { font-size: 11px; fill: #9aa3b2; }
    .title { font-size: 14.5px; font-weight: 600; fill: #e8eaed; }
    .arrow { stroke: #8b95a5; stroke-width: 1.6; fill: none; marker-end: url(#m-mq); }
  </style>
  <defs>
    <marker id="m-mq" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#8b95a5"/>
    </marker>
  </defs>
  <text x="410" y="26" text-anchor="middle" class="title">Fila desacopla produtor e consumidor</text>
  <rect x="176" y="100" width="140" height="64" class="box"/>
  <text x="246" y="128" text-anchor="middle" class="label" font-weight="600">Producer</text>
  <text x="246" y="148" text-anchor="middle" class="small">publica</text>
  <rect x="340" y="100" width="140" height="64" class="accent"/>
  <text x="410" y="128" text-anchor="middle" class="label" font-weight="600">Fila / Log</text>
  <text x="410" y="148" text-anchor="middle" class="small">buffer</text>
  <rect x="504" y="100" width="140" height="64" class="ok"/>
  <text x="574" y="128" text-anchor="middle" class="label" font-weight="600">Consumers</text>
  <text x="574" y="148" text-anchor="middle" class="small">processam</text>
  <path d="M316,132 L340,132" class="arrow"/>
  <path d="M480,132 L504,132" class="arrow"/>
  <text x="410" y="220" text-anchor="middle" class="small">Absorve picos e permite retry / fan-out</text>

</svg>
