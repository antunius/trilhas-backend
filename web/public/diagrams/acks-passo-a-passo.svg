<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="t">
  <title id="t">acks=0, acks=1 e acks=all</title>
  <rect width="920" height="360" fill="#fffdf8"/>
  <g font-family="system-ui, sans-serif">
    <text x="460" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1c1915">Quantos discos confirmam o Produce?</text>

    <!-- acks=0 -->
    <rect x="40" y="60" width="270" height="270" rx="12" fill="#fff" stroke="#d9d0c2"/>
    <text x="175" y="90" text-anchor="middle" font-size="11" letter-spacing="0.1em" fill="#c45c26">ACKS = 0</text>
    <text x="175" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1c1915">Fire and forget</text>
    <rect x="80" y="140" width="80" height="40" rx="6" fill="#f3e4d6" stroke="#c45c26"/>
    <text x="120" y="165" text-anchor="middle" font-size="12" fill="#1c1915">Producer</text>
    <line x1="160" y1="160" x2="210" y2="160" stroke="#c45c26" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="210" y="140" width="70" height="40" rx="6" fill="#fff" stroke="#d9d0c2"/>
    <text x="245" y="165" text-anchor="middle" font-size="12" fill="#5c564c">Líder</text>
    <text x="175" y="220" text-anchor="middle" font-size="13" fill="#5c564c">Não espera ACK.</text>
    <text x="175" y="242" text-anchor="middle" font-size="13" fill="#5c564c">Mais rápido.</text>
    <text x="175" y="264" text-anchor="middle" font-size="13" fill="#5c564c">Pode perder o fato.</text>
    <text x="175" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#c45c26">Não use em dinheiro</text>

    <!-- acks=1 -->
    <rect x="325" y="60" width="270" height="270" rx="12" fill="#fff" stroke="#d9d0c2"/>
    <text x="460" y="90" text-anchor="middle" font-size="11" letter-spacing="0.1em" fill="#c45c26">ACKS = 1</text>
    <text x="460" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1c1915">Só o líder</text>
    <rect x="365" y="140" width="70" height="40" rx="6" fill="#f3e4d6" stroke="#c45c26"/>
    <text x="400" y="165" text-anchor="middle" font-size="12" fill="#1c1915">Prod</text>
    <line x1="435" y1="160" x2="480" y2="160" stroke="#c45c26" stroke-width="2"/>
    <rect x="480" y="140" width="70" height="40" rx="6" fill="#e8f0ea" stroke="#2f6b4f"/>
    <text x="515" y="165" text-anchor="middle" font-size="12" fill="#1c1915">Líder</text>
    <text x="515" y="210" text-anchor="middle" font-size="11" fill="#5c564c">followers?</text>
    <text x="515" y="228" text-anchor="middle" font-size="11" fill="#5c564c">ainda não</text>
    <text x="460" y="264" text-anchor="middle" font-size="13" fill="#5c564c">ACK quando o líder gravou.</text>
    <text x="460" y="286" text-anchor="middle" font-size="13" fill="#5c564c">Morreu o líder: pode sumir.</text>
    <text x="460" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#c45c26">Meio-termo</text>

    <!-- acks=all -->
    <rect x="610" y="60" width="270" height="270" rx="12" fill="#fff" stroke="#2f6b4f"/>
    <text x="745" y="90" text-anchor="middle" font-size="11" letter-spacing="0.1em" fill="#2f6b4f">ACKS = ALL</text>
    <text x="745" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1c1915">Espera o ISR</text>
    <rect x="650" y="140" width="60" height="36" rx="6" fill="#f3e4d6" stroke="#c45c26"/>
    <text x="680" y="163" text-anchor="middle" font-size="11" fill="#1c1915">Prod</text>
    <line x1="710" y1="158" x2="748" y2="158" stroke="#2f6b4f" stroke-width="2"/>
    <rect x="748" y="130" width="54" height="32" rx="5" fill="#e8f0ea" stroke="#2f6b4f"/>
    <text x="775" y="151" text-anchor="middle" font-size="11" fill="#1c1915">Líder</text>
    <rect x="748" y="170" width="54" height="28" rx="5" fill="#fff" stroke="#2f6b4f"/>
    <text x="775" y="188" text-anchor="middle" font-size="10" fill="#5c564c">F1</text>
    <rect x="748" y="204" width="54" height="28" rx="5" fill="#fff" stroke="#2f6b4f"/>
    <text x="775" y="222" text-anchor="middle" font-size="10" fill="#5c564c">F2</text>
    <text x="745" y="260" text-anchor="middle" font-size="13" fill="#5c564c">ACK quando ISR gravou.</text>
    <text x="745" y="282" text-anchor="middle" font-size="13" fill="#5c564c">Custa milissegundos.</text>
    <text x="745" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#2f6b4f">Padrão para PedidoCriado</text>
  </g>
</svg>
