<svg viewBox="0 0 860 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" style="background:transparent">
  <style>
    .box { fill: #141a22; stroke: #3d4a5c; stroke-width: 2; rx: 6; }
    .a { fill: #1e2438; stroke: #818cf8; stroke-width: 1.6; rx: 6; }
    .b { fill: #14241f; stroke: #34d399; stroke-width: 1.6; rx: 6; }
    .warn { fill: #2a2114; stroke: #fbbf24; stroke-width: 1.6; rx: 6; }
    .label { font-size: 13px; fill: #e8eaed; font-weight: 600; }
    .small { font-size: 11px; fill: #9aa3b2; }
    .title { font-size: 15px; font-weight: 600; fill: #e8eaed; }
    .arrow { stroke: #8b95a5; stroke-width: 1.6; fill: none; marker-end: url(#ah-jud); }
  </style>
  <defs>
    <marker id="ah-jud" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8b95a5"/></marker>
  </defs>

  <text x="430" y="26" text-anchor="middle" class="title">Fila de submissões → sandbox isolado → resultado assíncrono</text>

  <rect x="30" y="60" width="130" height="60" class="box"/>
  <text x="95" y="95" text-anchor="middle" class="label">Usuário</text>

  <path d="M160,90 L250,90" class="arrow"/>
  <text x="205" y="78" text-anchor="middle" class="small">submete código</text>

  <rect x="255" y="60" width="150" height="60" class="a"/>
  <text x="330" y="95" text-anchor="middle" class="label">Fila de submissões</text>

  <path d="M405,90 L495,90" class="arrow"/>

  <rect x="500" y="45" width="330" height="90" class="warn"/>
  <text x="665" y="70" text-anchor="middle" class="label">Sandbox isolado</text>
  <text x="665" y="92" text-anchor="middle" class="small">limite de CPU, memória e tempo</text>
  <text x="665" y="108" text-anchor="middle" class="small">sem acesso a rede/disco do host</text>
  <text x="665" y="124" text-anchor="middle" class="small" fill="#fbbf24">um worker por submissão isolada</text>

  <path d="M330,120 L330,170" class="arrow"/>
  <text x="380" y="150" text-anchor="middle" class="small">enquanto isso</text>

  <rect x="180" y="175" width="300" height="55" class="b"/>
  <text x="330" y="198" text-anchor="middle" class="small" font-weight="600">Usuário consulta status</text>
  <text x="330" y="216" text-anchor="middle" class="small">(polling ou WebSocket) — não fica bloqueado esperando</text>

  <path d="M665,135 L665,200 L480,200" class="arrow" stroke-dasharray="4 3"/>
  <text x="600" y="188" text-anchor="middle" class="small">resultado: passou/falhou</text>

  <text x="430" y="255" text-anchor="middle" class="small">Em pico (competição), a fila absorve o excesso — workers escalam horizontalmente</text>
</svg>
