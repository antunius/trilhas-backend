<svg viewBox="0 0 860 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" style="background:transparent">
  <style>
    .box { fill: #141a22; stroke: #3d4a5c; stroke-width: 2; rx: 6; }
    .api { fill: #1e2438; stroke: #818cf8; stroke-width: 1.8; rx: 6; }
    .db { fill: #14241f; stroke: #34d399; stroke-width: 1.8; rx: 6; }
    .label { font-size: 12.5px; fill: #e8eaed; }
    .small { font-size: 11px; fill: #9aa3b2; }
    .title { font-size: 15px; font-weight: 600; fill: #e8eaed; }
    .arrow { stroke: #8b95a5; stroke-width: 1.6; fill: none; marker-end: url(#ah-url); }
    .write { stroke: #818cf8; stroke-width: 1.8; fill: none; marker-end: url(#ah-url-w); }
    .read { stroke: #34d399; stroke-width: 1.8; fill: none; marker-end: url(#ah-url-r); }
  </style>
  <defs>
    <marker id="ah-url" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#8b95a5"/>
    </marker>
    <marker id="ah-url-w" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#818cf8"/>
    </marker>
    <marker id="ah-url-r" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#34d399"/>
    </marker>
  </defs>

  <text x="430" y="26" text-anchor="middle" class="title">Encurtador: criar (write) e redirecionar (read)</text>

  <!-- Write path -->
  <text x="40" y="55" class="small" font-weight="600" fill="#818cf8">WRITE — criar link</text>
  <rect x="40" y="70" width="100" height="50" class="box"/>
  <text x="90" y="100" text-anchor="middle" class="label">Usuário</text>

  <path d="M140,95 L220,95" class="write"/>
  <text x="180" y="85" text-anchor="middle" class="small" fill="#818cf8">POST longUrl</text>

  <rect x="225" y="70" width="120" height="50" class="api"/>
  <text x="285" y="100" text-anchor="middle" class="label" font-weight="600">API</text>

  <path d="M345,95 L430,95" class="write"/>
  <text x="388" y="85" text-anchor="middle" class="small" fill="#818cf8">salva</text>

  <rect x="435" y="70" width="150" height="50" class="db"/>
  <text x="510" y="92" text-anchor="middle" class="label" font-weight="600">DB urls</text>
  <text x="510" y="110" text-anchor="middle" class="small">abc → longUrl</text>

  <path d="M285,120 L285,145 L90,145 L90,120" class="write"/>
  <text x="190" y="140" text-anchor="middle" class="small" fill="#818cf8">short = /abc</text>

  <!-- Read path -->
  <text x="40" y="195" class="small" font-weight="600" fill="#34d399">READ — redirecionar</text>
  <rect x="40" y="210" width="100" height="50" class="box"/>
  <text x="90" y="240" text-anchor="middle" class="label">Usuário</text>

  <path d="M140,235 L220,235" class="read"/>
  <text x="180" y="225" text-anchor="middle" class="small" fill="#34d399">GET /abc</text>

  <rect x="225" y="210" width="120" height="50" class="api"/>
  <text x="285" y="240" text-anchor="middle" class="label" font-weight="600">API</text>

  <path d="M345,235 L430,235" class="read"/>
  <text x="388" y="225" text-anchor="middle" class="small" fill="#34d399">lookup</text>

  <rect x="435" y="210" width="150" height="50" class="db"/>
  <text x="510" y="240" text-anchor="middle" class="label" font-weight="600">DB / Cache</text>

  <path d="M285,260 L285,290 L90,290 L90,260" class="read"/>
  <text x="190" y="285" text-anchor="middle" class="small" fill="#34d399">302 → longUrl</text>

  <text x="700" y="160" text-anchor="middle" class="small">Leituras ≫ escritas</text>
  <text x="700" y="178" text-anchor="middle" class="small">cache ajuda muito</text>
</svg>
