<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="t">
  <title id="t">Fila clássica vs log distribuído</title>
  <rect width="920" height="420" fill="#fffdf8"/>
  <g font-family="system-ui, sans-serif">
    <text x="460" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1c1915">Fila clássica vs log (Kafka)</text>
    <text x="460" y="58" text-anchor="middle" font-size="13" fill="#5c564c">na fila a mensagem some depois da leitura · no log ela permanece</text>

    <!-- Fila -->
    <rect x="40" y="90" width="400" height="300" rx="12" fill="#fff" stroke="#d9d0c2"/>
    <text x="240" y="118" text-anchor="middle" font-size="11" letter-spacing="0.1em" fill="#c45c26">FILA CLÁSSICA</text>
    <text x="240" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1c1915">RabbitMQ · SQS · ActiveMQ</text>

    <rect x="80" y="170" width="70" height="36" rx="6" fill="#f3e4d6" stroke="#c45c26"/>
    <text x="115" y="193" text-anchor="middle" font-size="12" fill="#1c1915">Prod</text>
    <line x1="150" y1="188" x2="200" y2="188" stroke="#c45c26" stroke-width="2"/>
    <rect x="200" y="160" width="120" height="56" rx="8" fill="#fff" stroke="#d9d0c2"/>
    <text x="260" y="185" text-anchor="middle" font-size="12" fill="#5c564c">broker</text>
    <text x="260" y="203" text-anchor="middle" font-size="11" fill="#c45c26">msg some</text>
    <line x1="320" y1="188" x2="370" y2="188" stroke="#c45c26" stroke-width="2"/>
    <rect x="370" y="170" width="50" height="36" rx="6" fill="#f3e4d6" stroke="#c45c26"/>
    <text x="395" y="193" text-anchor="middle" font-size="12" fill="#1c1915">Cons</text>

    <text x="240" y="260" text-anchor="middle" font-size="13" fill="#5c564c">Um consumidor pega.</text>
    <text x="240" y="282" text-anchor="middle" font-size="13" fill="#5c564c">A mensagem é apagada.</text>
    <text x="240" y="304" text-anchor="middle" font-size="13" fill="#5c564c">O segundo time fica sem.</text>
    <text x="240" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1c1915">Entrega e some</text>

    <!-- Log -->
    <rect x="480" y="90" width="400" height="300" rx="12" fill="#fff" stroke="#d9d0c2"/>
    <text x="680" y="118" text-anchor="middle" font-size="11" letter-spacing="0.1em" fill="#2f6b4f">LOG DISTRIBUÍDO</text>
    <text x="680" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1c1915">Apache Kafka</text>

    <rect x="520" y="170" width="70" height="36" rx="6" fill="#e8f0ea" stroke="#2f6b4f"/>
    <text x="555" y="193" text-anchor="middle" font-size="12" fill="#1c1915">Prod</text>
    <line x1="590" y1="188" x2="630" y2="188" stroke="#2f6b4f" stroke-width="2"/>
    <rect x="630" y="155" width="140" height="110" rx="8" fill="#fff" stroke="#d9d0c2"/>
    <text x="700" y="175" text-anchor="middle" font-size="11" fill="#5c564c">partição</text>
    <text x="700" y="198" text-anchor="middle" font-size="12" fill="#1c1915">0 · Evento A</text>
    <text x="700" y="218" text-anchor="middle" font-size="12" fill="#1c1915">1 · Evento B</text>
    <text x="700" y="238" text-anchor="middle" font-size="12" fill="#1c1915">2 · Evento C</text>
    <line x1="770" y1="175" x2="820" y2="155" stroke="#2f6b4f" stroke-width="2"/>
    <line x1="770" y1="220" x2="820" y2="240" stroke="#2f6b4f" stroke-width="2"/>
    <rect x="820" y="138" width="44" height="28" rx="5" fill="#e8f0ea" stroke="#2f6b4f"/>
    <text x="842" y="157" text-anchor="middle" font-size="10" fill="#1c1915">A@2</text>
    <rect x="820" y="226" width="44" height="28" rx="5" fill="#e8f0ea" stroke="#2f6b4f"/>
    <text x="842" y="245" text-anchor="middle" font-size="10" fill="#1c1915">B@1</text>

    <text x="680" y="300" text-anchor="middle" font-size="13" fill="#5c564c">Vários leitores. Cada um no próprio ritmo.</text>
    <text x="680" y="322" text-anchor="middle" font-size="13" fill="#5c564c">A linha não some na leitura.</text>
    <text x="680" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1c1915">Anexa e deixa o offset com quem leu</text>
  </g>
</svg>
