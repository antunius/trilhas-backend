<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" role="img" aria-labelledby="t">
  <title id="t">Envelope Kafka</title>
  <rect width="920" height="280" fill="#fffdf8"/>
  <g font-family="system-ui, sans-serif">
    <text x="460" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1c1915">O envelope no log</text>
    <text x="460" y="58" text-anchor="middle" font-size="13" fill="#5c564c">o broker guarda bytes · quem interpreta é o consumidor</text>

    <rect x="60" y="90" width="800" height="150" rx="12" fill="#fff" stroke="#d9d0c2"/>

    <rect x="80" y="110" width="140" height="110" rx="8" fill="#f3e4d6" stroke="#c45c26"/>
    <text x="150" y="140" text-anchor="middle" font-size="11" letter-spacing="0.08em" fill="#c45c26">KEY</text>
    <text x="150" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1c1915">99</text>
    <text x="150" y="192" text-anchor="middle" font-size="11" fill="#5c564c">escolhe partição</text>

    <rect x="240" y="110" width="220" height="110" rx="8" fill="#fff" stroke="#d9d0c2"/>
    <text x="350" y="140" text-anchor="middle" font-size="11" letter-spacing="0.08em" fill="#c45c26">VALUE</text>
    <text x="350" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1c1915">PedidoCriado</text>
    <text x="350" y="192" text-anchor="middle" font-size="11" fill="#5c564c">o fato · JSON/Avro</text>

    <rect x="480" y="110" width="120" height="110" rx="8" fill="#fff" stroke="#d9d0c2"/>
    <text x="540" y="140" text-anchor="middle" font-size="11" letter-spacing="0.08em" fill="#c45c26">OFFSET</text>
    <text x="540" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1c1915">4</text>
    <text x="540" y="192" text-anchor="middle" font-size="11" fill="#5c564c">carimbo do líder</text>

    <rect x="620" y="110" width="100" height="110" rx="8" fill="#fff" stroke="#d9d0c2"/>
    <text x="670" y="140" text-anchor="middle" font-size="11" letter-spacing="0.08em" fill="#c45c26">PART</text>
    <text x="670" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1c1915">P1</text>
    <text x="670" y="192" text-anchor="middle" font-size="11" fill="#5c564c">coluna</text>

    <rect x="740" y="110" width="100" height="110" rx="8" fill="#fff" stroke="#d9d0c2"/>
    <text x="790" y="140" text-anchor="middle" font-size="11" letter-spacing="0.08em" fill="#c45c26">HDRS</text>
    <text x="790" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1c1915">trace</text>
    <text x="790" y="192" text-anchor="middle" font-size="11" fill="#5c564c">tipo · corr</text>
  </g>
</svg>
