<svg viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" style="background:transparent">
  <style>
    .box { fill: #141a22; stroke: #3d4a5c; stroke-width: 2; rx: 6; }
    .a { fill: #1e2438; stroke: #818cf8; stroke-width: 1.6; rx: 6; }
    .b { fill: #14241f; stroke: #34d399; stroke-width: 1.6; rx: 6; }
    .warn { fill: #2a2114; stroke: #fbbf24; stroke-width: 1.6; rx: 6; }
    .label { font-size: 13px; fill: #e8eaed; font-weight: 600; }
    .small { font-size: 11px; fill: #9aa3b2; }
    .title { font-size: 15px; font-weight: 600; fill: #e8eaed; }
    .arrow { stroke: #8b95a5; stroke-width: 1.6; fill: none; marker-end: url(#ah-fd); }
  </style>
  <defs>
    <marker id="ah-fd" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8b95a5"/></marker>
  </defs>

  <text x="430" y="24" text-anchor="middle" class="title">Fan-out na escrita (normal) vs. na leitura (celebridade)</text>

  <rect x="30" y="45" width="360" height="115" class="a"/>
  <text x="210" y="68" text-anchor="middle" class="label">Usuário comum posta</text>
  <text x="210" y="90" text-anchor="middle" class="small">1.000 seguidores</text>
  <path d="M120,100 L120,130" class="arrow"/>
  <path d="M210,100 L210,130" class="arrow"/>
  <path d="M300,100 L300,130" class="arrow"/>
  <text x="210" y="148" text-anchor="middle" class="small" fill="#818cf8">pré-computa o feed de cada um dos 1.000 seguidores agora</text>

  <rect x="470" y="45" width="360" height="115" class="warn"/>
  <text x="650" y="68" text-anchor="middle" class="label">Celebridade posta</text>
  <text x="650" y="90" text-anchor="middle" class="small">50 milhões de seguidores</text>
  <text x="650" y="112" text-anchor="middle" class="small" fill="#fbbf24">fan-out na escrita aqui travaria o sistema</text>
  <text x="650" y="130" text-anchor="middle" class="small">→ só grava o post; feed é montado na leitura</text>

  <rect x="180" y="185" width="500" height="90" class="b"/>
  <text x="430" y="210" text-anchor="middle" class="label">Feed do seguidor, na hora de abrir o app</text>
  <text x="430" y="232" text-anchor="middle" class="small">mescla: posts já pré-computados (fan-out na escrita)</text>
  <text x="430" y="250" text-anchor="middle" class="small">+ posts de quem segue com muitos seguidores (buscados na hora)</text>

  <text x="430" y="295" text-anchor="middle" class="small">Abordagem híbrida: a maioria escreve na escrita, poucas contas grandes escrevem na leitura</text>
</svg>
