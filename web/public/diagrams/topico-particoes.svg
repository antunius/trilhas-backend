    <text x="740" y="164" text-anchor="middle" font-size="13" fill="#5c564c">1 · key 88</text>

    <text x="460" y="290" text-anchor="middle" font-size="13" fill="#5c564c">Offset 1 da P1 ` offset 1 da P0 · não existe ordem global no tópico</text>
