<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" style="background:transparent">
  <style>
    .box { fill: #1e2438; stroke: #818cf8; stroke-width: 1.8; rx: 6; }
    .title { font-size: 13px; fill: #e8eaed; font-weight: 700; }
    .member { font-size: 11.5px; fill: #9aa3b2; font-family: monospace; }
    .caption { font-size: 15px; font-weight: 600; fill: #e8eaed; }
    .small { font-size: 11px; fill: #9aa3b2; }
    .arrow { stroke: #8b95a5; stroke-width: 1.6; fill: none; marker-end: url(#ah-s); }
  </style>
  <defs>
    <marker id="ah-s" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8b95a5"/></marker>
  </defs>

  <text x="350" y="26" text-anchor="middle" class="caption">Singleton</text>

  <rect x="220" y="50" width="260" height="150" class="box"/>
  <line x1="220" y1="80" x2="480" y2="80" stroke="#818cf8" stroke-width="1"/>
  <line x1="220" y1="140" x2="480" y2="140" stroke="#818cf8" stroke-width="1"/>
  <text x="350" y="70" text-anchor="middle" class="title">ConfiguracaoApp</text>
  <text x="235" y="98" class="member">- static instancia: ConfiguracaoApp</text>
  <text x="235" y="116" class="member">- ConfiguracaoApp()  « privado »</text>
  <text x="235" y="158" class="member">+ static getInstance():</text>
  <text x="250" y="174" class="member">  ConfiguracaoApp</text>
  <text x="235" y="190" class="member">+ getValor(chave): String</text>

  <rect x="60" y="230" width="150" height="55" class="box"/>
  <text x="135" y="255" text-anchor="middle" class="small" font-weight="600">Módulo A</text>
  <text x="135" y="272" text-anchor="middle" class="small">chama getInstance()</text>

  <rect x="490" y="230" width="150" height="55" class="box"/>
  <text x="565" y="255" text-anchor="middle" class="small" font-weight="600">Módulo B</text>
  <text x="565" y="272" text-anchor="middle" class="small">chama getInstance()</text>

  <path d="M180,230 L280,200" class="arrow"/>
  <path d="M520,230 L420,200" class="arrow"/>

  <text x="350" y="310" text-anchor="middle" class="small">Os dois módulos recebem a MESMA instância — o construtor nunca roda duas vezes</text>
</svg>
