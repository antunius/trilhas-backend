<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" style="background:transparent">
  <style>
    .iface { fill: #1e2438; stroke: #818cf8; stroke-width: 1.8; rx: 6; }
