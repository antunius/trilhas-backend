<svg viewBox="0 0 860 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" style="background:transparent">
  <style>
    .box { fill: #141a22; stroke: #3d4a5c; stroke-width: 2; rx: 6; }
    .a { fill: #1e2438; stroke: #818cf8; stroke-width: 1.6; rx: 6; }
    .b { fill: #14241f; stroke: #34d399; stroke-width: 1.6; rx: 6; }
    .warn { fill: #2a2114; stroke: #fbbf24; stroke-width: 1.6; rx: 6; }
    .label { font-size: 13px; fill: #e8eaed; font-weight: 600; }
    .small { font-size: 11px; fill: #9aa3b2; }
    .title { font-size: 15px; font-weight: 600; fill: #e8eaed; }
    .arrow { stroke: #8b95a5; stroke-width: 1.6; fill: none; marker-end: url(#ah-msg); }
    .live { stroke: #34d399; stroke-width: 2; fill: none; marker-end: url(#ah-msg-g); }
  </style>
  <defs>
    <marker id="ah-msg" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8b95a5"/></marker>
    <marker id="ah-msg-g" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#34d399"/></marker>
  </defs>

  <text x="430" y="26" text-anchor="middle" class="title">Destinatário online (WebSocket) vs. offline (mailbox)</text>

  <rect x="40" y="60" width="140" height="60" class="box"/>
  <text x="110" y="95" text-anchor="middle" class="label">Remetente</text>

  <path d="M180,90 L280,90" class="arrow"/>
  <text x="230" y="80" text-anchor="middle" class="small">send(msg)</text>

  <rect x="285" y="55" width="150" height="70" class="a"/>
  <text x="360" y="85" text-anchor="middle" class="label">Servidor</text>
  <text x="360" y="105" text-anchor="middle" class="small">grava histórico</text>

  <path d="M435,80 L520,80" class="live"/>
  <text x="478" y="70" text-anchor="middle" class="small" fill="#34d399">push direto</text>

  <rect x="525" y="55" width="150" height="70" class="b"/>
  <text x="600" y="80" text-anchor="middle" class="label">Destinatário</text>
  <text x="600" y="100" text-anchor="middle" class="small" fill="#34d399">online · WebSocket aberto</text>

  <path d="M360,125 L360,170" class="arrow"/>
  <text x="410" y="150" text-anchor="middle" class="small">se offline</text>

  <rect x="285" y="175" width="150" height="60" class="warn"/>
  <text x="360" y="200" text-anchor="middle" class="label">Mailbox</text>
  <text x="360" y="220" text-anchor="middle" class="small">fila persistente</text>

  <path d="M360,235 L360,270 L600,270 L600,235" class="arrow" stroke-dasharray="5 3"/>
  <text x="480" y="290" text-anchor="middle" class="small">flush quando reconectar</text>

  <text x="430" y="305" text-anchor="middle" class="small">Estados "entregue"/"lida" avançam nos dois lados só depois do ACK do destinatário</text>
</svg>
